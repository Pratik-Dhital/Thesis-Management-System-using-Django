{% extends "base.html" %}
{% block start %}
<form class="col-6 mx-auto card p-3 shadow-lg mt-5" method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <h2>Sign up</h2>
    <hr>
    <div class="mb-3">
        <label for="firstName" class="form-label">First Name</label>
        <input type="text" class="form-control" id="FirstName" name="first_name">
    </div>

    <div class="mb-3">
        <label for="lastName" class="form-label">Last Name</label>
        <input type="text" class="form-control" id="lastName" name="last_name">
    </div>

    <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input type="text" class="form-control" id="username" name="username">
    </div>

    <div class="mb-3">
        <label for="exampleInputEmail1" class="form-label">Email address</label>
        <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" name="email">
    </div>
    <div class="mb-3">
        <label for="exampleInputPassword1" class="form-label">Password</label>
        <input type="password" class="form-control" id="exampleInputPassword1" name="password">
    </div>
    <div class="form-floating">
        <select class="form-control" id="floatingSelect" aria-label="Floating label select example" name="role">
            <option selected>Mention role</option>
            <option value="student">Student</option>
            <option value="lecturer">Lecturer</option>
            <option value="supervisor">Supervisor</option>
        </select>
    </div>
    <p>Have an account? <a href="/login">Sign in</a></p>
    <button type="submit" class="btn btn-primary">Register</button>
</form>

{% endblock %}
