{% extends "base.html" %}

{% block start %}

<div class="col-6 mx-auto card p-4 mt-5">

    <h2>
        Complete Student Profile
    </h2>

    <hr>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button
            type="submit"
            class="btn btn-primary"
        >
            Save Profile
        </button>

    </form>

</div>

{% endblock %}
