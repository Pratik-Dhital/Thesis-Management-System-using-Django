{% extends "base.html" %}
{% block start %}

<form method="post"
      class="col-6 mx-auto card p-4 mt-5">

    {% csrf_token %}

    <h2>Assign Role</h2>

    <p>{{ user_obj.email }}</p>

    <select name="role" class="form-control">

        <option value="student">Student</option>

        <option value="lecturer">Lecturer</option>

    </select>

    <button class="btn btn-primary mt-3">
        Assign
    </button>

</form>

{% endblock %}
