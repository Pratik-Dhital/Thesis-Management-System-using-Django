{% extends "base.html" %}

{% block start %}

<div class="card p-4">

    <h2>{{ proposal.title }}</h2>

    <p>{{ proposal.description }}</p>

    <p>
        Current Status:
        <strong>
            {{ proposal.status.name }}
        </strong>
    </p>

    <a href="{{ proposal.document.url }}"
       class="btn btn-info">

       View Document

    </a>

    <form method="POST" class="mt-4">

        {% csrf_token %}

        <label>
            Select Status
        </label>

        <select
            name="status"
            class="form-control"
        >

            {% for status in statuses %}

            <option
                value="{{ status.id }}"
            >
                {{ status.name }}
            </option>

            {% endfor %}

        </select>

        <textarea
            name="comment"
            class="form-control mt-3"
            placeholder="Comment"
        ></textarea>

        <button
            type="submit"
            class="btn btn-success mt-3"
        >
            Update Proposal
        </button>

    </form>

</div>

{% endblock %}
