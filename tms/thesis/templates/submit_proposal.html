{% extends "base.html" %}

{% block start %}

<div class="col-8 mx-auto card p-4 mt-5">

    <h2>
        Submit Proposal
    </h2>

    <hr>

    <form
        method="POST"
        enctype="multipart/form-data"
    >

        {% csrf_token %}

        {{ form.as_p }}

        <button
            type="submit"
            class="btn btn-primary"
        >
            Submit Proposal
        </button>

    </form>

</div>

{% endblock %}
